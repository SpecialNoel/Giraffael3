<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="title">Sign up</title>
    <link rel="icon" type="image/png" href="giraffe-favicon.png" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/pages/auth.css" />
  </head>

  <body class="auth-page">
    <h1>This is a sign-up page</h1>

    <!-- Sign-up -->
    <form id="sign-up-form">
      <label for="email"> Email: </label>
      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      />
      <label for="plainPassword"> Password: </label>
      <input
        id="plainPassword"
        type="password"
        placeholder="Enter your password"
        autocomplete="new-password"
        maxlength="16"
        required
      />
      <button type="submit">Sign up</button>
    </form>

    <a class="link" href="/signin">Go to Sign-In</a>

    <!-- Handle user side sign-up services -->
    <script type="module" src="/pages/sign-up-page.js"></script>
  </body>
</html>
