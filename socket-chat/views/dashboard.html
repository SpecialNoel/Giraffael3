<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="title">Dashboard</title>
    <link rel="icon" type="image/png" href="giraffe-favicon.png" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/pages/dashboard.css" />
    <link rel="stylesheet" href="/css/components/navigation.css" />
    <link rel="stylesheet" href="/css/components/room.css" />
    <link rel="stylesheet" href="/css/components/message.css" />
  </head>

  <body>
    <!-- Buttons to other pages -->
    <div class="top-nav">
      <a href="/friends">Friends</a>
      <a href="/settings">Settings</a>
      <a href="/signin">Logout</a>
    </div>

    <div class="dashboard">
      <!-- Left panel -->
      <div class="left-panel">
        <!-- Room selection -->
        <div class="card card-left">
          <div>
            <!-- Create a new room -->
            <h4>Room name:</h4>
            <input
              type="text"
              id="roomNameInCreateRoom"
              class="room-input"
              placeholder="Enter room name"
              maxlength="20"
              autocomplete="off"
            />
            <button class="create-btn">Create room</button>
          </div>
          <hr class="divider" />
          <!-- Join an existing room -->
          <div>
            <h4>Room code:</h4>
            <input
              type="text"
              id="roomCodeInJoinRoom"
              class="room-input"
              placeholder="Enter room code"
              maxlength="20"
              autocomplete="off"
            />
            <button class="join-btn">Join room</button>
          </div>
        </div>

        <!-- Room list -->
        <div class="card card-left">
          <div><h4>Room List:</h4></div>
          <div id="rooms-container"></div>
        </div>
      </div>

      <!-- Right panel -->
      <div class="right-panel">
        <!-- Chatroom info -->
        <div class="card">
          <div>
            <label id="roomCodeInChat">Room Code: </label>
          </div>
          <div>
            <label id="userIdInChat">User ID: </label>
          </div>
        </div>

        <!-- Chat message list -->
        <div class="card chat-card">
          <h4>Message history:</h4>
          <ul id="messages"></ul>
        </div>

        <!-- Input and send message -->
        <div class="card">
          <h4>Send Message:</h4>
          <form id="form" action="">
            <input id="input" autocomplete="off" />
            <button class="send-btn">Send</button>
          </form>
        </div>

        <!-- Member list -->
        <div class="card">
          <h4 id="memberListHeading">Members (0)</h4>
          <p id="emptyMessage">No one is in the room.</p>
          <ul id="memberList"></ul>
        </div>
      </div>
    </div>

    <!-- Create the SocketIO user -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Handle user side dashboard services -->
    <script type="module" src="/pages/dashboard-page.js"></script>
  </body>
</html>
